# =============================================================================
# Kitty 终端配置
# 文档: https://sw.kovidgoyal.net/kitty/conf/
# 重新加载配置: ctrl+shift+f5 （或 kitty @ launch --type=overlay）
# =============================================================================

# -----------------------------------------------------------------------------
# 字体
# p10k 推荐 MesloLGS NF；如未安装可改用其它 Nerd Font：
#   brew install --cask font-meslo-lg-nerd-font
# -----------------------------------------------------------------------------
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# 字符渲染
disable_ligatures never
# 行高/字距微调（默认即可，需要时再放开）
# modify_font cell_height 3px

# -----------------------------------------------------------------------------
# 主题 / 配色
# 内置主题切换: kitty +kitten themes
# -----------------------------------------------------------------------------
# Tokyo Night（暗色，与常见 nvim 主题协调）
include theme.conf

# 背景透明度与模糊（macOS 原生支持）
background_opacity 0.92
background_blur 2

# 滚动
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# -----------------------------------------------------------------------------
# 窗口 / 布局
# -----------------------------------------------------------------------------
remember_window_size  no
initial_window_width  1200
initial_window_height 800
window_padding_width  6
window_border_width   0
draw_minimal_borders  yes
layout_splits         horizontal
enable_audio_bell     no

# 标签页样式
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# -----------------------------------------------------------------------------
# 光标 / 鼠标
# -----------------------------------------------------------------------------
cursor_shape          beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

mouse_hide_wait       3.0
url_style             curly
open_url_with         default
strip_trailing_spaces never

# 选中即复制到系统剪贴板（与 tmux 的 pbcopy 协作）
copy_on_select        yes

# -----------------------------------------------------------------------------
# 性能 / 渲染
# -----------------------------------------------------------------------------
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# macOS 上用 metal 后端，性能更好
macos_titlebar_color       background
macos_option_as_alt        yes
macos_quit_when_last_window_closed yes

# -----------------------------------------------------------------------------
# Shell
# 启动时直接进入 tmux（如果不在 tmux 内），与 .tmux.conf 配合
# -----------------------------------------------------------------------------
# default_shell  zsh
# 如果希望 kitty 启动即 attach tmux，取消下面注释：
# startup_session ~/.config/kitty/startup.session

# -----------------------------------------------------------------------------
# 快捷键
# kitty 默认前缀为 ctrl+shift，下面只覆盖/补充常用项
# -----------------------------------------------------------------------------
# 新建标签页 / 窗口
map ctrl+shift+t new_tab
map ctrl+shift+enter new_window
map ctrl+shift+w close_window

# 标签页切换（alt+数字更顺手）
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab

# 窗口分屏与切换（vim 风格）
map ctrl+shift+d launch --location=vsplit --cwd=current
map ctrl+shift+s launch --location=hsplit --cwd=current
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# 字体大小
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

# 复制到系统剪贴板
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# 与 nvim/tmux 协作：把 ctrl+shift 复用给程序时用 kitty +kitten
# 重新加载配置
map ctrl+shift+f5 load_config_file
