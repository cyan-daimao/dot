set -g mouse on

# 启用 Vi 风格的复制模式按键
setw -g mode-keys vi

# 配置复制相关按键（Vi 风格）
# 在复制模式中：
# - v 进入可视模式（选中文本）
# - y 复制选中的文本到 tmux 缓冲区
# - Y 复制从当前位置到行尾的文本
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi Y send-keys -X copy-line

bind-key -T copy-mode-vi y send-keys -X copy-selection \; run-shell "tmux show-buffer | pbcopy"

set -g focus-events
